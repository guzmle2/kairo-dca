[project]
name = "kairo-dca"
version = "0.1.0"
description = "Boring, honest ETF dollar-cost-averaging: contribution ledger, Telegram alerts, country profiles and a preregistered backtest toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairo"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "hypothesis==6.168.5",
    "pre-commit==4.6.2",
    "pip-audit==2.10.1",
    "pandas-stubs==3.0.5.260914",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["kairo", "tests"]
extend-exclude = ["document"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "N",         # pep8-naming
    "SIM",       # simplify
    "RUF",       # reglas propias de ruff
    "PL",        # pylint
    "S",         # bandit
    "T20",       # sin print
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.12"
files = ["kairo", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
